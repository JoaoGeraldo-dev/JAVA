<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
</head>
<body>
<h1>Cadastro de Usuário</h1>
<form th:action="@{/web/usuarios/salvar}" th:object="${usuario}" method="post">
    <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required>
    </div>
    <div>
        <label for="email">E-mail:</label>
        <input type="email" id="email" th:field="*{email}" required>
    </div>
    <div>
        <label for="idade">Idade:</label>
        <input type="number" id="idade" th:field="*{idade}" required>
    </div>
    <br>
    <button type="submit">Salvar</button>
</form>
<p><a th:href="@{/web/usuarios/lista}">Consultar usuários</a></p>
<p><a th:href="@{/home}">Voltar para a Home</a></p>
</body>
</html>
