<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
</head>
<body>
<h1>Lista de Produtos</h1>

<h3>Buscar por nome</h3>
<form th:action="@{/web/produtos/lista}" method="get">
    <input type="text" name="nome" placeholder="Digite o nome">
    <button type="submit">Buscar</button>
</form>

<h3>Buscar por preço</h3>
<form th:action="@{/web/produtos/lista}" method="get">
    <input type="number" step="0.01" min="0" name="preco" placeholder="Digite o preço">
    <button type="submit">Buscar</button>
</form>

<p><a th:href="@{/web/produtos/lista}">Mostrar todos</a></p>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Data de Fabricação</th>
    </tr>

    <tr th:each="produto : ${produtos}">
        <td th:text="${produto.id}"></td>
        <td th:text="${produto.nome}"></td>
        <td th:text="${produto.preco}"></td>
        <td th:text="${#dates.format(produto.dataFabricacao, 'dd/MM/yyyy')}"></td>
    </tr>
</table>

<p><a th:href="@{/web/produtos/novo}">Cadastrar produto</a></p>
<p><a th:href="@{/home}">Voltar para a Home</a></p>
</body>
</html>
