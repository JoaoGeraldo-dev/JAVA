<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>
</head>
<body>
<h1>Lista de Usuários</h1>
<form th:action="@{/web/usuarios/lista}" method="get">
    <input type="text" name="nome" placeholder="Buscar por nome">
    <button type="submit">Buscar</button>
</form>
<p><a th:href="@{/web/usuarios/lista}">Mostrar todos</a></p>
<table border="1">
    <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Idade</th>
    </tr>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.nome}"></td>
        <td th:text="${usuario.email}"></td>
        <td th:text="${usuario.idade}"></td>
    </tr>
</table>
<p><a th:href="@{/web/usuarios/novo}">Cadastrar usuário</a></p>
<p><a th:href="@{/home}">Voltar para a Home</a></p>
</body>
</html>
