```html
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
</head>

<body>

<h1>Cadastro de Cliente</h1>

<form th:action="@{/web/clientes/salvar}"
      th:object="${cliente}"
      method="post">

    <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}">
    </div>

    <div>
        <label for="email">E-mail:</label>
        <input type="email" id="email" th:field="*{email}">
    </div>

    <div>
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" th:field="*{telefone}">
    </div>

    <div>
        <label for="idade">Idade:</label>
        <input type="number" id="idade" th:field="*{idade}">
    </div>

    <div>
        <label for="rg">RG:</label>
        <input type="text" id="rg" th:field="*{rg}">
    </div>

    <div>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" th:field="*{cpf}">
    </div>

    <div>
        <label for="data_Nascimento">Data de nascimento:</label>
        <input type="date" id="data_Nascimento" th:field="*{data_Nascimento}">
    </div>

    <br>

    <button type="submit">Salvar</button>

</form>

</body>
</html>
```
